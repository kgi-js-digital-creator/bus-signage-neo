name: Deploy to kgi-js-digital-creator/bus-signage

on:
  workflow_dispatch:
concurrency:
  group: deploy-prod
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      BASE: /bus-signage/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: bus-signage
      - name: Clone repository
        run: git clone --branch main --single-branch "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository_owner }}/bus-signage.git" deploy
      - name: Generate ISO 8601 timestamp
        id: timestamp
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Cleanup gh-pages
        run: find deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: deploy/
      - name: Push to repository
        working-directory: deploy
        run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No changes to deploy"
            else
              git commit -m "Deploy by @${{ github.actor }} ${{ steps.timestamp.outputs.time }}"
              git push origin HEAD:main
            fi