name: Deploy development gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: deploy-dev
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      BASE: /bus-signage-neo/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Cleanup gh-pages
        run: find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: dist
      - name: Generate ISO 8601 timestamp
        id: timestamp
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Update: ${{ steps.timestamp.outputs.time }}"
            git push origin HEAD:gh-pages
          fi